server {
  listen 80;
  root /usr/share/nginx/html;

  # Patient uploads (photos of prescriptions and reports) go through here.
  client_max_body_size 20m;

  # The API lives in the backend container. "backend" is its name on the Docker network.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # Built files have a hash in their name, so they can be cached for long.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # Every other path is a page of the app, such as /c/abc123 or /portal/cases/1.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
